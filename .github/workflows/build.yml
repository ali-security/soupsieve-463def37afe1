name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector; empty runs the full suite'
        required: false
        default: ''
        type: string

jobs:
  tests:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        # Python micro versions are pinned to the releases current at
        # soupsieve 2.4.1's release date (2023-04-16). CPython 3.9.21+/3.10.17+/
        # 3.11.12+ ship a reworked `html.parser` that stops descending into
        # `<iframe>` content, which fails 8 of this suite's iframe tests
        # (test_soup_contains, test_lang, test_root, test_default, test_dir,
        # test_indeterminate) on the unpatched base. Pinning the era-appropriate
        # interpreter keeps the whole suite running instead of excluding tests.
        include:
          - tox-env: py37
            python-version: 3.7
            continue-on-error: false
          - tox-env: py38
            python-version: 3.8
            continue-on-error: false
          - tox-env: py39
            python-version: 3.9.16
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10.10'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11.3'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.11.3'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.10.10'
            continue-on-error: false
          # 3.9.16 was a source-only security release, so actions/setup-python
          # has no Windows build for it. 3.9.13 is the last 3.9 with a Windows
          # installer and is likewise pre-`html.parser`-rework, so this cell
          # alone drops back to it.
          - platform: windows-latest
            tox-env: py39
            python-version: 3.9.13
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' pip setuptools build tox coverage
    - name: Test
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          PYTEST_ADDOPTS="-k ${{ inputs.test-filter }}" python -m tox
        else
          python -m tox
        fi
    - name: Install release build backend
      if: matrix.platform == 'ubuntu-22.04' && matrix.tox-env == 'py311'
      run: |
        python -m pip install --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' hatchling==1.14.0 build
    - name: Build sdist and wheel
      if: matrix.platform == 'ubuntu-22.04' && matrix.tox-env == 'py311'
      run: |
        python -m build --sdist --wheel --no-isolation
    - name: Upload distributions
      if: matrix.platform == 'ubuntu-22.04' && matrix.tox-env == 'py311'
      uses: actions/upload-artifact@v4
      with:
        name: soupsieve-dist-ubuntu-22.04-py311
        path: dist/
        if-no-files-found: error
